<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trợ lý tri thức</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<style>
body{overflow:hidden}
.layout{display:flex;height:100%}
.side{width:272px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{padding:14px 12px 8px;display:flex;flex-direction:column;gap:12px}
.side-top .brandrow{padding:0 4px}
.newchat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:500;text-align:left}
.newchat span{font-size:18px;line-height:1;color:var(--blue)}
.side-h{padding:10px 16px 4px;font-size:12px;color:var(--muted);font-weight:500}
.convlist{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px}
.conv{display:flex;align-items:center;gap:4px;padding:7px 6px 7px 10px;border-radius:8px;font-size:14px}
.conv:hover,.conv[aria-current="true"]{background:var(--surface)}
.conv[aria-current="true"]{font-weight:500}
.cbtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:0}
.cbtn .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .x{opacity:0;border:0;background:none;color:var(--muted);font-size:13px;padding:0 4px}
.conv:hover .x,.conv:focus-within .x{opacity:1}
.side-foot{border-top:1px solid var(--line);padding:10px 16px;font-size:14px}
.side-foot b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot span{color:var(--muted);font-size:13px}
.mainpane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:56px}
.bar .ttl{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#menuBtn{display:none}
.welcome{max-width:560px;margin:14vh auto 0;text-align:center;padding:0 20px}
.welcome h2{font-size:26px;font-weight:600;line-height:1.3;margin:0 0 8px}
.welcome p{color:var(--muted);margin:0}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.composer{padding:10px 20px 14px}
.cbox{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;display:flex;gap:8px;align-items:flex-end}
.cbox textarea{flex:1;resize:none;border:0;background:none;padding:8px 0;min-height:40px;max-height:180px;outline:none}
.cfoot{max-width:760px;margin:6px auto 0;font-size:12px;color:var(--muted);text-align:center}
.waitnote{max-width:760px;margin:0 auto 8px;background:var(--agent-soft);color:var(--agent);border-radius:10px;padding:8px 12px;font-size:14px}
.scrim{display:none}
@media (max-width:820px){
  .side{position:fixed;top:0;bottom:0;left:0;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,20,35,.35);z-index:20}
  #menuBtn{display:inline-block}
  .thread{padding:6px 14px 20px}.composer{padding:8px 12px 12px}
  .msg.mine .bubble{max-width:90%}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<!-- Đăng nhập -->
<div class="authwrap" id="loginView" hidden>
  <div class="authcard">
    <div class="brandrow"><div class="mark" aria-hidden="true">KB</div><b class="appName">Trợ lý tri thức</b></div>
    <h1>Bắt đầu trò chuyện</h1>
    <p>Nhập tên Zalo và số điện thoại để lưu lịch sử hỏi đáp và để nhân viên hỗ trợ liên hệ khi cần.</p>
    <form id="loginForm" novalidate>
      <label>Tên Zalo<input id="lName" autocomplete="name" maxlength="80" required></label>
      <label>Số điện thoại<input id="lPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0901234567" required></label>
      <label class="consent"><input type="checkbox" id="lConsent"> Tôi đồng ý cho lưu tên và số điện thoại để được hỗ trợ.</label>
      <button class="btn block" id="lBtn">Vào trò chuyện</button>
      <div class="err" id="lErr" role="alert"></div>
    </form>
  </div>
</div>

<!-- Chat -->
<div class="layout" id="chatView" hidden>
  <aside class="side" id="side">
    <div class="side-top">
      <div class="brandrow"><div class="mark" aria-hidden="true">KB</div><b class="appName">Trợ lý tri thức</b></div>
      <button class="newchat" id="newChat"><span aria-hidden="true">+</span>Cuộc trò chuyện mới</button>
    </div>
    <div class="side-h">Lịch sử</div>
    <div class="convlist" id="convList"></div>
    <div class="side-foot"><b id="meName"></b><span id="mePhone"></span><br><button class="link" id="logoutBtn">Đăng xuất</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="mainpane">
    <header class="bar">
      <button class="iconbtn" id="menuBtn" aria-label="Mở lịch sử">☰</button>
      <div class="ttl" id="convTitle">Cuộc trò chuyện mới</div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <div class="scroll" id="scroll"><div class="thread" id="thread" aria-live="polite"></div></div>
    <div class="composer">
      <div class="waitnote" id="waitNote" hidden></div>
      <div class="cbox">
        <textarea id="q" rows="1" placeholder="Nhập câu hỏi…" aria-label="Câu hỏi" maxlength="4000"></textarea>
        <button class="btn" id="sendBtn">Gửi</button>
      </div>
      <div class="cfoot">Trợ lý trả lời dựa trên tài liệu nội bộ và có thể chuyển cho nhân viên hỗ trợ.</div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/static/common.js"></script>
<script>
(() => {
"use strict";
const S = { me: null, cfg: { name: "Trợ lý tri thức", suggest: [], welcome: "", wait: "" }, convs: [], cur: null, conv: null, msgs: [], lastId: 0, busy: false, pending: null, timer: null };

function applyCfg(){
  for (const el of document.querySelectorAll(".appName")) el.textContent = S.cfg.name;
  document.title = S.cfg.name;
}
function showLogin(){ $("loginView").hidden = false; $("chatView").hidden = true; $("lName").focus(); }
function showChat(){
  $("loginView").hidden = true; $("chatView").hidden = false;
  $("meName").textContent = S.me.zalo_name; $("mePhone").textContent = S.me.phone;
  loadConvs(); render();
}

/* ---------- Đăng nhập ---------- */
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("lErr").textContent = "";
  const name = $("lName").value.trim(), phone = $("lPhone").value.trim();
  if (!name) return $("lErr").textContent = "Nhập tên Zalo của bạn.";
  if (!/^(\+?84|0)\d{9}$/.test(phone.replace(/[\s.-]/g, ""))) return $("lErr").textContent = "Số điện thoại cần 10 số, ví dụ 0901234567.";
  if (!$("lConsent").checked) return $("lErr").textContent = "Bạn cần đồng ý lưu thông tin để tiếp tục.";
  $("lBtn").disabled = true;
  try{ S.me = await api("/api/auth/login", { method: "POST", body: { zalo_name: name, phone } }); showChat(); }
  catch(err){ $("lErr").textContent = err.message; }
  $("lBtn").disabled = false;
});
$("logoutBtn").onclick = async () => { try{ await api("/api/auth/logout", { method: "POST" }); }catch(e){} location.reload(); };

/* ---------- Danh sách cuộc trò chuyện ---------- */
const seen = () => { try{ return JSON.parse(localStorage.getItem("kb_seen") || "{}"); }catch(e){ return {}; } };
const markSeen = (id) => { try{ const s = seen(); s[id] = Date.now(); localStorage.setItem("kb_seen", JSON.stringify(s)); }catch(e){} };
async function loadConvs(){
  try{ S.convs = await api("/api/conversations"); renderConvs(); }
  catch(e){ if (e.status === 401 || e.status === 403){ if (e.status === 403) toast(e.message); showLogin(); } }
}
function renderConvs(){
  const s = seen();
  $("convList").innerHTML = S.convs.length ? S.convs.map(c => {
    const unread = c.last_role === "agent" && c.id !== S.cur && c.updated_at > (s[c.id] || 0);
    return `<div class="conv" ${c.id === S.cur ? 'aria-current="true"' : ""}><button class="cbtn" data-id="${c.id}">${unread ? '<span class="dot" title="Có trả lời mới"></span>' : ""}<span class="t">${esc(c.title || "Cuộc trò chuyện")}</span></button><button class="x" data-hide="${c.id}" aria-label="Ẩn khỏi lịch sử" title="Ẩn khỏi lịch sử">✕</button></div>`;
  }).join("") : '<p class="note" style="padding:0 10px">Chưa có cuộc trò chuyện nào.</p>';
}
$("convList").addEventListener("click", async (e) => {
  const h = e.target.closest("[data-hide]");
  if (h){ if (!confirm("Ẩn cuộc trò chuyện này khỏi lịch sử của bạn?")) return;
    try{ await api(`/api/conversations/${h.dataset.hide}/hide`, { method: "POST" }); if (+h.dataset.hide === S.cur) openConv(null); loadConvs(); }catch(err){ toast(err.message); } return; }
  const b = e.target.closest("[data-id]"); if (b){ openConv(+b.dataset.id); closeSide(); }
});
function openSide(){ $("side").classList.add("open"); $("scrim").classList.add("open"); }
function closeSide(){ $("side").classList.remove("open"); $("scrim").classList.remove("open"); }
$("menuBtn").onclick = openSide; $("scrim").onclick = closeSide;
$("newChat").onclick = () => { openConv(null); closeSide(); $("q").focus(); };

async function openConv(id){
  S.cur = id; S.conv = null; S.msgs = []; S.lastId = 0; S.pending = null;
  renderConvs(); render();
  if (id){ await pollMessages(true); markSeen(id); }
}
async function pollMessages(scrollToEnd){
  if (!S.cur || S.busy) return;
  const id = S.cur;
  try{
    const r = await api(`/api/conversations/${id}/messages?after=${S.lastId}`);
    if (id !== S.cur) return;
    S.conv = r.conversation;
    if (r.messages.length){
      S.msgs.push(...r.messages); S.lastId = r.messages[r.messages.length - 1].id; markSeen(id);
      render(true);
    } else if (scrollToEnd) render(true); else renderWait();
  }catch(e){ if (e.status === 401) showLogin(); }
}
setInterval(() => { if (!document.hidden && $("chatView").hidden === false) pollMessages(false); }, 4000);
setInterval(() => { if (!document.hidden && $("chatView").hidden === false) loadConvs(); }, 20000);

/* ---------- Hiển thị ---------- */
function renderWait(){
  const last = S.msgs[S.msgs.length - 1];
  const waiting = S.conv && S.conv.needs_human && (!S.conv.ai_active) && last && last.role !== "agent";
  $("waitNote").hidden = !waiting; $("waitNote").textContent = S.cfg.wait;
}
function render(forceBottom){
  const c = S.convs.find(x => x.id === S.cur);
  $("convTitle").textContent = S.conv?.title || c?.title || "Cuộc trò chuyện mới";
  const sc = $("scroll"); const atBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
  if (!S.cur && !S.msgs.length){
    const sugg = (S.cfg.suggest || []).slice(0, 4);
    $("thread").innerHTML = `<div class="welcome"><h2>Chào ${esc(S.me?.zalo_name || "bạn")}, bạn cần hỗ trợ gì?</h2><p>${esc(S.cfg.welcome || "")}</p>
      ${sugg.length ? `<div class="suggest">${sugg.map(s => `<button data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}</div>`;
  } else {
    $("thread").innerHTML = S.msgs.map(m => messageHtml(m, "user")).join("") +
      (S.pending !== null ? `<div class="msg ai"><div class="who"><span>Trợ lý AI</span></div><div class="bubble" id="pending">${S.pending}</div></div>` : "");
  }
  renderWait();
  if (forceBottom || atBottom) sc.scrollTop = sc.scrollHeight;
}
$("thread").addEventListener("click", (e) => { const b = e.target.closest("[data-s]"); if (b){ $("q").value = b.dataset.s; send(); } });

/* ---------- Gửi câu hỏi (nhận stream NDJSON) ---------- */
function autosize(){ const t = $("q"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; }
$("q").addEventListener("input", autosize);
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$("sendBtn").onclick = send;

async function send(){
  const text = $("q").value.trim(); if (!text || S.busy) return;
  S.busy = true; $("sendBtn").disabled = true; $("q").value = ""; autosize();
  $("banner").hidden = true;
  const tempUser = { id: "tmp", role: "user", text };
  S.msgs.push(tempUser); S.pending = null; render(true);
  let streamed = "";
  try{
    const r = await fetch("/api/chat", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: S.cur, text }) });
    if (!r.ok){ let d = null; try{ d = await r.json(); }catch(e){} const err = new Error(d?.detail || "Không gửi được"); err.status = r.status; throw err; }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;){
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "conversation"){
          if (!S.cur){ S.cur = ev.conversation.id; S.convs.unshift(ev.conversation); renderConvs(); }
          S.conv = ev.conversation;
        } else if (ev.type === "user_message"){
          const i = S.msgs.indexOf(tempUser); if (i >= 0) S.msgs[i] = ev.message; S.lastId = Math.max(S.lastId, ev.message.id);
        } else if (ev.type === "status"){
          S.pending = `<span class="thinking">${esc(ev.text)}</span>`; render(true);
        } else if (ev.type === "delta"){
          streamed += ev.text; S.pending = renderMd(streamed, "pending", new Set());
          const el = $("pending"); if (el){ el.innerHTML = S.pending; $("scroll").scrollTop = $("scroll").scrollHeight; } else render(true);
        } else if (ev.type === "message"){
          S.pending = null; S.msgs.push(ev.message); S.lastId = Math.max(S.lastId, ev.message.id); render(true);
        } else if (ev.type === "waiting"){
          S.pending = null; S.conv = { ...(S.conv || {}), needs_human: true, ai_active: false }; render(true);
        }
      }
    }
  }catch(err){
    S.pending = null; const i = S.msgs.indexOf(tempUser); if (i >= 0) S.msgs.splice(i, 1);
    if (err.status === 401) return showLogin();
    $("q").value = text; $("banner").textContent = err.message || "Mất kết nối, thử gửi lại."; $("banner").hidden = false; render();
  }finally{
    S.busy = false; $("sendBtn").disabled = false; loadConvs();
  }
}

/* ---------- Khởi động ---------- */
(async () => {
  try{ S.cfg = { ...S.cfg, ...(await api("/api/public/settings")) }; }catch(e){}
  applyCfg();
  try{ S.me = await api("/api/me"); showChat(); }
  catch(e){ if (e.status === 403) toast(e.message); showLogin(); }
})();
})();
</script>
</body>
</html>
