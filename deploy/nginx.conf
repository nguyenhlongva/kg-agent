# /etc/nginx/sites-available/khanhhuyen.ai.zalopay.xyz
server {
    listen 80;
    server_name khanhhuyen.ai.zalopay.xyz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name khanhhuyen.ai.zalopay.xyz;

    ssl_certificate     /etc/letsencrypt/live/khanhhuyen.ai.zalopay.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khanhhuyen.ai.zalopay.xyz/privkey.pem;

    client_max_body_size 30m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Câu trả lời AI được stream: tắt buffer để chữ hiện dần
    location /api/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
